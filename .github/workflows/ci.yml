name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release (package.json engines) and the current LTS.
        node: ['22.22.3', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Binding types match wrangler.jsonc
        run: npm run cf-typegen && git diff --exit-code -- worker-configuration.d.ts
      - run: npm run check
